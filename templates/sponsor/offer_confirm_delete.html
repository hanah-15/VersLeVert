{% extends "ui/base.html" %}
{% block title %}Retirer une offre · Vers le Vert{% endblock %}
{% block content %}
<section class="ui-card ui-card-pad mx-auto max-w-xl space-y-5"><span class="ui-icon-box">{% include "ui/icon.html" with name="shop" %}</span><h1>Retirer cette offre ?</h1><p>Vous allez retirer <strong>{{ object.title }}</strong> de votre boutique.</p><form method="post" class="ui-form-actions">{% csrf_token %}<button class="inline-flex items-center justify-center rounded-full border border-brick/50 bg-white/20 px-7 py-3.5 font-ui text-[14px] font-semibold text-brick backdrop-blur-md !transition-all !duration-500 !ease-out hover:-translate-y-0.5 hover:border-brick hover:bg-brick/10 active:translate-y-0 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-palm/40">Confirmer le retrait</button><a class="inline-flex items-center justify-center rounded-full border border-palm/60 bg-white/20 px-7 py-3.5 font-ui text-[14px] font-semibold text-forest backdrop-blur-md !transition-all !duration-500 !ease-out hover:-translate-y-0.5 hover:border-palm hover:bg-palm/20 active:translate-y-0 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-palm/40" href="{% url 'sponsor-shop' %}">Annuler</a></form></section>
{% endblock %}
