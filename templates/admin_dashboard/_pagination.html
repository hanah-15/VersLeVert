{% if is_paginated %}
<nav aria-label="Pagination" class="flex flex-wrap items-center justify-between gap-3">
  <p class="text-sm text-muted">Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</p>
  <div class="flex gap-2">
    {% if page_obj.has_previous %}<a class="ui-button ui-button-secondary ui-button-small" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Précédent</a>{% endif %}
    {% if page_obj.has_next %}<a class="ui-button ui-button-secondary ui-button-small" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Suivant</a>{% endif %}
  </div>
</nav>
{% endif %}
