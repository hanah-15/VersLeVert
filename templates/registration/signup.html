{% extends "base.html" %}
{% block title %}Inscription · Vers le Vert{% endblock %}

{% block content %}
<div class="mx-auto my-10 max-w-[440px] rounded-lg-ui border border-olive bg-porcelain p-8">
    <h2 class="font-heading text-[28px] font-semibold leading-tight text-forest">Créer un compte</h2>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            {% include "components/form_field.html" %}
        {% endfor %}
        <button type="submit" class="inline-flex min-h-[46px] w-full items-center justify-center gap-2 rounded-md-ui border-2 border-forest bg-forest px-[22px] py-2.5 text-base font-bold text-porcelain hover:bg-palm hover:text-forest focus:outline-none focus:ring-4 focus:ring-sky">S'inscrire</button>
    </form>

    <p class="mt-[18px] text-[15px]">Déjà un compte ? <a href="{% url 'login' %}">Connecte-toi</a></p>
</div>
{% endblock %}
