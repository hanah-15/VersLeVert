{% extends "base.html" %}
{% block title %}Inscription · Vers le Vert{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Créer un compte</h2>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            {% include "components/form_field.html" %}
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-block">S'inscrire</button>
    </form>

    <p class="auth-foot">Déjà un compte ? <a href="{% url 'login' %}">Connecte-toi</a></p>
</div>
{% endblock %}
