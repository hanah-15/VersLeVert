<article class="flex flex-col gap-3.5 rounded-lg-ui border border-olive bg-olive/25 p-6">
    <div class="flex items-start justify-between gap-3">
        <h3 class="font-heading text-[20px] font-semibold leading-tight text-forest">{{ title }}</h3>
        <span class="inline-flex rounded-full bg-olive px-3 py-[5px] text-[13px] font-bold text-forest">{{ points }} pts</span>
    </div>
    <p class="text-[13px] font-bold uppercase tracking-[0.09em] text-forest">{{ sponsor }}</p>
    <p>{{ description }}</p>
    <div class="mt-3.5 flex gap-2.5">
        <button type="button" class="inline-flex min-h-[46px] items-center justify-center gap-2 rounded-md-ui border-2 border-forest bg-forest px-[22px] py-2.5 text-base font-bold text-porcelain hover:bg-palm hover:text-forest focus:outline-none focus:ring-4 focus:ring-sky">Échanger</button>
        <button type="button" class="inline-flex min-h-[46px] items-center justify-center gap-2 rounded-md-ui border-2 border-forest bg-transparent px-[22px] py-2.5 text-base font-bold text-forest hover:bg-olive focus:outline-none focus:ring-4 focus:ring-sky">Détails</button>
    </div>
</article>
