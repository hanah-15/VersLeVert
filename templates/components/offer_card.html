<article class="flex flex-col gap-3.5 rounded-lg-ui border border-olive bg-olive/25 p-6">
    <div class="flex items-start justify-between gap-3">
        <h3 class="font-heading text-[20px] font-semibold leading-tight text-forest">{{ title }}</h3>
        <span class="inline-flex rounded-full bg-olive px-3 py-[5px] text-[13px] font-bold text-forest">{{ points }} pts</span>
    </div>
    <p class="text-[13px] font-bold uppercase tracking-[0.09em] text-forest">{{ sponsor }}</p>
    <p>{{ description }}</p>
    <div class="mt-3.5 flex gap-2.5">
        <button type="button" class="inline-flex items-center justify-center rounded-full bg-palm px-7 py-3.5 font-ui text-[14px] font-semibold text-forest shadow-card !transition-all !duration-500 !ease-out hover:-translate-y-0.5 hover:bg-olive hover:shadow-float active:translate-y-0 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-palm/40">Échanger</button>
        <button type="button" class="inline-flex items-center justify-center rounded-full border border-palm/60 bg-white/20 px-7 py-3.5 font-ui text-[14px] font-semibold text-forest backdrop-blur-md !transition-all !duration-500 !ease-out hover:-translate-y-0.5 hover:border-palm hover:bg-palm/20 active:translate-y-0 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-palm/40">Détails</button>
    </div>
</article>
