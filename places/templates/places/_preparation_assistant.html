<div class="writing-help">
  <div class="writing-toolbar"><button type="button" class="ui-button ui-button-small" data-prepare-recommendation>{% include "ui/icon.html" with name="spark" %} Améliorer mon texte</button><span>Corriger et reformuler avec l'IA</span></div>
  <p class="writing-privacy">Votre avis est envoyé à Gemini uniquement en cliquant ici.</p>
  <p data-preparation-status role="status" aria-live="polite" class="text-sm text-forest"></p>
  <div data-preparation-errors role="alert" class="ui-errors" hidden></div>
  <div data-preparation-result class="writing-suggestion" hidden>
    <h2 class="text-sm font-semibold">Une proposition pour votre avis</h2>
    <blockquote data-prepared-description class="whitespace-pre-wrap"></blockquote>
    <p data-preparation-warnings class="text-xs text-muted" hidden></p>
    <div data-prepared-location-section class="writing-location" hidden><span class="text-xs text-muted">Lieu repéré dans votre avis</span><strong data-prepared-location class="block"></strong><p data-prepared-location-note class="text-xs text-muted"></p></div>
    <div class="flex flex-wrap gap-3"><button type="button" data-apply-preparation class="ui-button ui-button-primary ui-button-small">Utiliser la suggestion</button><button type="button" data-dismiss-preparation class="ui-button ui-button-small">Garder mon texte</button></div>
  </div>
  <button type="button" data-restore-preparation class="ui-link text-xs" hidden>Annuler la modification</button>
</div>
