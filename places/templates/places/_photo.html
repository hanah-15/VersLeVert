{% if entry.image %}<figure class="entry-photo {% if entry.product_name %}product-entry-photo{% endif %}"><img src="{{ entry.image.url }}" alt="{{ entry }}" width="1000" height="650">{% if entry.image_credit %}<figcaption>{% if entry.image_source %}<a href="{{ entry.image_source }}" target="_blank" rel="noopener noreferrer">{{ entry.image_credit }}</a>{% else %}{{ entry.image_credit }}{% endif %}</figcaption>{% endif %}</figure>{% endif %}
