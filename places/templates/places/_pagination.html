{% if is_paginated %}
<nav aria-label="Pagination" class="flex flex-wrap items-center justify-center gap-4 py-5 text-sm font-bold text-forest">
  {% if page_obj.has_previous %}<a class="rounded-xl border border-palm px-4 py-3 focus:outline-none focus:ring-4 focus:ring-sky" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Précédente</a>{% endif %}
  <span>Page {{ page_obj.number }} sur {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="rounded-xl border border-palm px-4 py-3 focus:outline-none focus:ring-4 focus:ring-sky" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Suivante →</a>{% endif %}
</nav>
{% endif %}
