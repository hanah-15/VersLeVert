{% if is_paginated %}
<nav aria-label="Pagination" class="flex flex-wrap items-center justify-center gap-4 py-5 text-sm font-bold text-forest">
  {% if page_obj.has_previous %}<a class="rounded-xl border px-4 py-3 focus:outline-none focus:ring-4 focus:ring-sky inline-flex items-center justify-center rounded-full border border-palm/60 bg-white/20 px-7 py-3.5 font-ui text-[14px] font-semibold text-forest backdrop-blur-md !transition-all !duration-500 !ease-out hover:-translate-y-0.5 hover:border-palm hover:bg-palm/20 active:translate-y-0 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-palm/40" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Précédente</a>{% endif %}
  <span>Page {{ page_obj.number }} sur {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="rounded-xl border px-4 py-3 focus:outline-none focus:ring-4 focus:ring-sky inline-flex items-center justify-center rounded-full border border-palm/60 bg-white/20 px-7 py-3.5 font-ui text-[14px] font-semibold text-forest backdrop-blur-md !transition-all !duration-500 !ease-out hover:-translate-y-0.5 hover:border-palm hover:bg-palm/20 active:translate-y-0 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-palm/40" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Suivante →</a>{% endif %}
</nav>
{% endif %}
