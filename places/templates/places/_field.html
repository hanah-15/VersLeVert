<div class="space-y-2">
  <label for="{{ field.id_for_label }}" class="block text-sm font-bold text-forest">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span><span class="sr-only"> (obligatoire)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p id="{{ field.id_for_label }}_help" class="text-sm text-carbon">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div id="{{ field.id_for_label }}_errors" class="text-sm font-bold text-brick" role="alert">{{ field.errors }}</div>{% endif %}
</div>
