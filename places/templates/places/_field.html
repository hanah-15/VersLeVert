<div class="ui-field"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-palm" aria-hidden="true">*</span><span class="sr-only"> (obligatoire)</span>{% endif %}</label>{{ field }}{% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="ui-help">{{ field.help_text }}</p>{% endif %}{% if field.errors %}<div id="{{ field.auto_id }}_error" class="ui-errors" role="alert">{{ field.errors }}</div>{% endif %}</div>
