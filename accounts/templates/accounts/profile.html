{% extends "ui/base.html" %}
{% block title %}Profil · Vers le Vert{% endblock %}
{% block content %}<header class="ui-page-header"><div><p class="ui-eyebrow">Un espace à votre image</p><h1>Mon profil</h1></div></header><section class="ui-card ui-card-pad flex flex-wrap items-center gap-5"><span class="flex h-20 w-20 items-center justify-center rounded-2xl bg-olive/30 font-heading text-3xl text-forest">{{ user.username|slice:":1"|upper }}</span><div><h2 class="text-2xl">{{ user.username }}</h2><p class="mt-2 text-sm text-muted">{{ user.email }}</p></div><a class="ui-button ui-button-secondary sm:ml-auto" href="{% url 'profile-overview' %}">Modifier mon profil</a></section>{% endblock %}
