{% extends "ui/base.html" %}
{% block title %}Profil · Vers le Vert{% endblock %}
{% block content %}<header class="ui-page-header"><div><p class="ui-eyebrow">Un espace à votre image</p><h1>Mon profil</h1></div></header><section class="ui-card ui-card-pad flex flex-wrap items-center gap-5"><span class="flex h-20 w-20 items-center justify-center rounded-2xl bg-olive/30 font-heading text-3xl text-forest">{{ user.username|slice:":1"|upper }}</span><div><h2 class="text-2xl">{{ user.username }}</h2><p class="mt-2 text-sm text-muted">{{ user.email }}</p></div><a class="sm:ml-auto inline-flex items-center justify-center rounded-full border border-palm/60 bg-white/20 px-7 py-3.5 font-ui text-[14px] font-semibold text-forest backdrop-blur-md !transition-all !duration-500 !ease-out hover:-translate-y-0.5 hover:border-palm hover:bg-palm/20 active:translate-y-0 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-palm/40" href="{% url 'profile-overview' %}">Modifier mon profil</a></section>{% endblock %}
