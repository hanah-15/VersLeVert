{% extends "base.html" %}
{% block title %}Déclarer un déchet · Vers le Vert{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Déclarer un déchet trié</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            {% include "components/form_field.html" %}
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-block">Envoyer la demande</button>
    </form>
</div>
{% endblock %}
